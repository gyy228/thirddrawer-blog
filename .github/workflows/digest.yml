name: Daily digest draft

# 每天自动抓取订阅源、让模型精选 5 条，把草稿提交到 digests/drafts/。
# 草稿不会自动发布——你在控制台逐条核对后点发布才会出现在站上。

on:
  schedule:
    # 08:00 北京时间 = 00:00 UTC。
    # GitHub 的定时任务用 UTC，且高峰期可能延迟十几分钟才启动。
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动点一下跑，方便调试
  workflow_dispatch:
    inputs:
      force:
        description: "已有今天的草稿时也重新生成（会覆盖草稿）"
        type: boolean
        default: false

# 需要写权限才能把草稿提交回仓库
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 抓取阶段不需要 Key，先单独跑一次确认 8 个源都通。
      # 源挂了会在这里失败，而不是等到调模型时才报错，
      # 排查起来更直接。
      - name: Check feeds
        env:
          SITE_DIR: ${{ github.workspace }}
        run: node tools/digest/run.mjs --dry

      - name: Generate draft
        env:
          SITE_DIR: ${{ github.workspace }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node tools/digest/run.mjs ${{ inputs.force && '--force' || '' }}

      # 明确检查草稿有没有真的生成。
      # 之前出过「工作流显示成功但什么都没生成」的情况
      # （时区算错导致命中已有草稿静默跳过），加这一步让它不再静默。
      - name: Verify draft exists
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ -f "digests/drafts/$TODAY.json" ]; then
            echo "✓ 今天的草稿存在：digests/drafts/$TODAY.json"
          else
            echo "✗ 没有生成今天的草稿（预期 digests/drafts/$TODAY.json）"
            ls -la digests/drafts/ || true
            exit 1
          fi

      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add digests/drafts

          if git diff --staged --quiet; then
            echo "今天没有新草稿（可能已经生成过了），跳过提交。"
            exit 0
          fi

          git commit -m "content: 生成 $(TZ=Asia/Shanghai date +%F) 选刊草稿"
          git push