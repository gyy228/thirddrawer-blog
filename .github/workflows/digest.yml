name: Daily digest

# 每天自动抓取订阅源、让模型精选 5 条，直接发布到 digests/。
#
# 站长已授权自动发布（2026-10-29 起），不再经过人工审核。
# 内容会随站点构建上线；发现不合适可以在控制台「选刊」里下架或修改。

on:
  schedule:
    # 08:00 北京时间 = 00:00 UTC。
    # GitHub 的定时任务用 UTC，且高峰期可能延迟十几分钟才启动。
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动点一下跑，方便调试
  workflow_dispatch:
    inputs:
      force:
        description: "已有今天的选刊时也重新生成（会覆盖并重新发布）"
        type: boolean
        default: false

# 需要写权限才能把选刊提交回仓库
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 抓取阶段不需要 Key，先单独跑一次确认 8 个源都通。
      # 源挂了会在这里失败，而不是等到调模型时才报错，
      # 排查起来更直接。
      - name: Check feeds
        env:
          SITE_DIR: ${{ github.workspace }}
        run: node tools/digest/run.mjs --dry

      - name: Generate and publish
        env:
          SITE_DIR: ${{ github.workspace }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # 用环境变量显式传，别用 `${{ 表达式 }}` 拼进命令行——
          # 之前那版拼出来是空串，force 根本没生效，工作流却是绿的。
          FORCE: ${{ inputs.force }}
        run: |
          echo "收到的 force 参数：[$FORCE]"
          if [ "$FORCE" = "true" ]; then
            echo "→ 带 --force --publish 运行（覆盖并重新发布今天这期）"
            node tools/digest/run.mjs --publish --force
          else
            echo "→ 正常模式（生成后直接发布；今天已有就跳过）"
            node tools/digest/run.mjs --publish
          fi

      # 明确检查产物有没有真的写出来。
      # 之前出过「工作流显示成功但什么都没生成」的情况
      # （时区算错、max_tokens 用尽、force 拼成空串），加这一步让它不再静默。
      - name: Verify published digest exists
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          FILE="digests/$TODAY.json"
          if [ ! -f "$FILE" ]; then
            echo "✗ 没有生成 $FILE"
            ls -la digests/ || true
            exit 1
          fi

          STATUS=$(node -e "console.log(require('./$FILE').status)")
          COUNT=$(node -e "console.log(require('./$FILE').items.length)")
          echo "✓ $FILE 存在，status=$STATUS，$COUNT 条"

          if [ "$STATUS" != "published" ]; then
            echo "✗ status 应该是 published，实际是 $STATUS —— 这期不会出现在站上"
            exit 1
          fi

      - name: Commit published digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add digests

          if git diff --staged --quiet; then
            echo "今天没有新内容（可能已经生成过了），跳过提交。"
            exit 0
          fi

          git commit -m "content: 发布 $(TZ=Asia/Shanghai date +%F) 选刊"
          git push